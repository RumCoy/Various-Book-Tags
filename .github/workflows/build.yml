name: Build Various Book Tags

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_FEATURE_FLAGS: manifests,registries,binarycaching
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

jobs:
  build-windows:
    name: Windows / MSVC 2022
    runs-on: windows-2022

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Check out vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: aa2d37682e3318d93aef87efa7b0e88e81cd3d59
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Ensure vcpkg binary cache directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --preset release

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build DLL
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --build --preset release

      - name: Create Nexus-ready release ZIPs
        shell: pwsh
        run: |
          $packageSource = "Package Source - MAKE EDITS HERE/Data/SKSE/Plugins"
          $userConfig = Join-Path $packageSource "VariousBookTags_UserConfig.ini"
          $stageRoot = Join-Path $env:RUNNER_TEMP "VariousBookTagsRelease"
          $outputRoot = Join-Path $env:RUNNER_TEMP "VariousBookTagsOutput"
          $mainRoot = Join-Path $stageRoot "main"
          $userPlugins = Join-Path $stageRoot "user\Data\SKSE\Plugins"

          cmake --install build/release --config Release --prefix (Join-Path $mainRoot "Data")
          if (!(Test-Path (Join-Path $mainRoot "Data\SKSE\Plugins\VariousBookTags.dll"))) {
            throw "Expected packaged DLL was not produced: VariousBookTags.dll"
          }
          if (!(Test-Path (Join-Path $mainRoot "Data\SKSE\Plugins\VariousBookTags_InternalData.ini"))) {
            throw "Expected internal configuration was not packaged"
          }

          New-Item -ItemType Directory -Force -Path $userPlugins | Out-Null
          Copy-Item -LiteralPath $userConfig -Destination (Join-Path $userPlugins "VariousBookTags_UserConfig.ini")

          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          Compress-Archive -LiteralPath (Join-Path $mainRoot "Data") -DestinationPath (Join-Path $outputRoot "Various Book Tags - Main File.zip") -CompressionLevel Optimal -Force
          Compress-Archive -LiteralPath (Join-Path $stageRoot "user\Data") -DestinationPath (Join-Path $outputRoot "Various Book Tags - User Config.zip") -CompressionLevel Optimal -Force

      - name: Upload both Nexus-ready ZIPs
        uses: actions/upload-artifact@v6
        with:
          name: Various-Book-Tags-Release-Zips
          path: ${{ runner.temp }}/VariousBookTagsOutput/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Various-Book-Tags-build-diagnostics
          path: |
            build/release/CMakeCache.txt
            build/release/vcpkg-manifest-install.log
            build/release/vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: ignore
