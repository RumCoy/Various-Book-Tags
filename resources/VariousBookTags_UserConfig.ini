; All lines/fields are optional. Plugin sections only override the lines/settings you include.
; Including a line but leaving its value blank/empty 'clears' the built-in value.
;
; [Plugin:ExampleModThatIHopeIsntReal3.esp]
; Tag=FirstTag)(SecondTag      //    Parentheses are automatically added.
; ModNameTags=true/false       //    Set 'false' to disable mod-name tags for this plugin. Defaults true.
; SkillTags=true/false         //    Set 'false' to disable skill tags for this plugin. Defaults true.
; IncludeForms=D6B,00000E6C    //    When populated, tags ONLY the specified entries.
; ExcludeForms=000A0C,0xD5A    //    When populated, excludes the specified entries.
;
; FormID 0x and leading zeroes are optional.
; Example: D6B, 00000D6B, and 0xD6B are all equivalent.

[General]
; This controls whether any books are tagged at all.
Enabled=true

; This controls SkillTags GLOBALLY. Default: SkillTags=true
SkillTags=true

; This controls ModNameTags GLOBALLY. Default: ModNameTags=true
ModNameTags=true

; Default: GlobalPluginNameFallback=false
; When true, automatically generates missing tags based on plugin filename.
GlobalPluginNameFallback=false

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;; Place custom rules below ;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Prevents mod-name tags for plugin:
[Plugin:ExampleModThatIHopeIsntReal2.esp]
ModNameTags=false

; Changes or sets a plugin's tag:
[Plugin:ExampleModThatIHopeIsntReal1.esp]
Tag=Simple Example

