;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; This is just an example that has the optional plugin-specific fields:
[Plugin:ExampleModThatIHopeIsntReal2.esp]
Tag=Example Tag
ModNameTags=
SkillTags=
IncludeForms=
ExcludeForms=

; This is a simpler example. Adds (Simple Example) to all books from the specified plugin:
[Plugin:ExampleModThatIHopeIsntReal1.esp]
Tag=Simple Example
