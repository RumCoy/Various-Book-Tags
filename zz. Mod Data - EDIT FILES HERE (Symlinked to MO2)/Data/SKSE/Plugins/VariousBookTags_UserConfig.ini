; Please make your changes and edits here. Plugin sections here don't merge with VariousBookTags_InternalData.ini; each matching plugin section completely replaces the InternalData version.
	; ModNameTags=true/false
	;		Line not present, or empty field, defaults to true. On/off switch for mod-name tags. (e.g., (Little Library) or (Immersive College) tags)
	; ClassTags=true/false
	;		Line not present, or empty field, defaults to true. On/off switch for Skill/Class tags. (e.g., (Restoration) or (Archery) tags)
	; IncludeForms=FormID1,FormID2, FormID3
	;		Line not present, or empty field, defaults to including every book from the plugin.
	;		Entries will cause VBT to tag *only* the specified books. Spaces after commas in list are optional.
	; ExcludeForms=FormID1,FormID2, FormID3
	;		Line not present, or empty field, defaults to nothing being excluded.
	;		Entries will cause VBT to exclude the specified books. Spaces after commas in list are optional.
	; You will need FormIDs for IncludeForms/ExcludeForms.
	;		Please see sasnikol's "FormIDs and You" for general information regarding FormIDs: https://www.nexusmods.com/skyrimspecialedition/articles/6629

[General]
; Global rules. General on/off switches if you don't want certain features such as class/skill tags.
Enabled=true
ModNameTags=true
ClassTags=true
GlobalPluginNameFallback=false 
	; GlobalPluginNameFallback will tag every book from every mod, using its plugin name if not explicitly tagged/supported in this INI or in InternalData.

