; Please make your changes and edits here. Plugin sections here don't merge with VariousBookTags_InternalData.ini; each matching plugin section completely replaces the InternalData version.

	; ModNameTags=
	;	Empty field defaults to true. On/off control for mod-name tags. (e.g., (Little Library) or (Immersive College) tags)
	; ClassTags=
	;	Empty field defaults to true. On/off for Skill/Class tags. (e.g., (Restoration) or (Archery) tags)
	; IncludeForms=
	;   Empty field defaults to including every book from the plugin.
	;	Entries will cause VBT to tag *only* the specified books.
	; ExcludeForms=
	;	Empty field defaults to nothing being excluded.
	;	Entries will cause VBT to exclude the specified books.
	; You will need FormIDs for IncludeForms/ExcludeForms.
	;	Please see sasnikol's "FormIDs and You" for general information regarding FormIDs: https://www.nexusmods.com/skyrimspecialedition/articles/6629

[General]
; Global rules. General on/off switches if you don't want certain features such as class/skill tags.
Enabled=true
ModNameTags=true
ClassTags=true
GlobalPluginNameFallback=false 
	; GlobalPluginNameFallback will tag every book from every mod, using its plugin name if not explicitly tagged/supported in this INI or in InternalData.

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;; Mod-specific rule below ;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; This example tags everything from/for specified mod:
; [Plugin:ExampleMod.esp]
; Tag=Example Mod
; ModNameTags=
; ClassTags=
; IncludeForms=
; ExcludeForms=
;
