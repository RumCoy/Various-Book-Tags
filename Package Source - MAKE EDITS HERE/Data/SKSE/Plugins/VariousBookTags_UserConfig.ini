; Please make your changes and edits here. Plugin sections here don't merge with VariousBookTags_InternalData.ini; each matching plugin completely replaces the InternalData version.

	; IncludeForms=
	;   Empty field defaults to including every book from the plugin.
	;	Entries will cause VBT to tag *only* the specified books.
	; ExcludeForms=
	;	Empty field defaults to nothing being excluded.
	;	Entries will cause VBT to exclude the specified books.
	; You will need FormIDs for IncludeForms/ExcludeForms.
	;	Please see sasnikol's "FormIDs and You" for general information regarding FormIDs: https://www.nexusmods.com/skyrimspecialedition/articles/6629

[General]
Enabled=true
ClassTags=true
SourceTags=true
GlobalPluginNameFallback=false
	; Default value is false. By default, only explicitly listed plugins are tagged.
	; When GlobalPluginNameFallback=true, unlisted plugins use their plugin name as a tag.

; Tag every book created by this plugin:
; [Plugin:ExampleMod.esp]
; Tag=Example Mod
; ClassTags=
; SourceTags=
; IncludeForms=
; ExcludeForms=
